services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: casebrief
      POSTGRES_PASSWORD: casebrief
      POSTGRES_DB: casebrief
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebrief"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
