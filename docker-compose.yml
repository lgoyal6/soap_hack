services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casebrief
      POSTGRES_PASSWORD: casebrief
      POSTGRES_DB: casebrief
    ports:
      - "5433:5432"   # host 5433: many laptops already run a Postgres on 5432
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebrief"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
